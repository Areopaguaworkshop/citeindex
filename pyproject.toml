[project]
name = "citeindex"
version = "0.13.2"
description = "Ingest sources with proper citation — PDF, URL, media, Office, DJVU"
authors = [{ name = "ajia", email = "yyjfwoaini@gmail.com" }]
dependencies = [
    "pymupdf[mupdf-third]>=1.26.3",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "trafilatura>=1.6.0",
    "dspy-ai>=2.6.27",
    "pypinyin>=0.51.0",
    "citeproc-py>=0.7.0",
    "readability-lxml>=0.8.1",
    "pyyaml>=6.0.0",
    "litellm>=1.83.0",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.1.0",
]
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"

[project.scripts]
citeindex = "citeindex.cli:main"

[project.optional-dependencies]
ocr-mineru = ["mineru[pipeline]>=3.4.5,<4.0.0"]
ocr-paddle = ["paddleocr>=3.1.0", "paddlepaddle>=3.1.0"]
ocr-legacy = ["ocrmypdf>=16.10.4", "fasttext>=0.9.2"]
media = ["pymediainfo>=7.0.1", "yt-dlp>=2025.7.21", "whisperx>=3.1.0", "pyannote-audio>=3.1.0"]
media-wenbi = ["pymediainfo>=7.0.1", "yt-dlp>=2025.7.21"]
web-browser = ["playwright>=1.40.0"]
crawl = ["crawl4ai>=0.7.0"]
layout = ["pymupdf4llm>=1.27.2.3"]

[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["pytest>=7.0.0", "pytest-cov>=2.12.1", "psutil>=6.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["citeindex"]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"citeindex/vertical_llm.py" = ["F811", "F821"]
"citeindex/ingestion/pipelines/pageindex/*.py" = ["E402", "E722", "F401", "F403", "F405", "F811", "F821"]
